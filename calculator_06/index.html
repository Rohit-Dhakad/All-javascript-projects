<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(
          135deg,
          rgba(37, 150, 190) rgba(37, 150, 190) rgba(37, 150, 190)
        );
      }

      .container {
        width: 320px;
        padding: 22px;

        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 18px;

        box-shadow: 0 20px 50px rgba(50, 60, 100, 0.15);

        backdrop-filter: blur(10px);
      }

      form > input {
        width: 90%;
        height: 70px;

        margin-bottom: 16px;
        padding: 10px 15px;

        border: 1px solid #e5e7eb;
        border-radius: 12px;
        outline: none;

        background: #f8fafc;
        color: #1e293b;

        font-size: 28px;
        font-weight: 500;
        text-align: right;
      }

      form > input:focus {
        border-color: #a5b4fc;
      }

      form div {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }

      form div input {
        width: 25%;
        height: 55px;

        border: 1px solid #e5e7eb;
        border-radius: 11px;

        background: #f8fafc;
        color: #334155;

        font-size: 18px;
        cursor: pointer;

        transition: all 0.15s ease;
      }

      form div input:hover {
        background: #eef2ff;
        border-color: #c7d2fe;
        transform: translateY(-1px);
      }

      form div input:active {
        transform: translateY(0);
      }

      form div input[value="/"],
      form div input[value=""],
      form div input[value="-"],
      form div input[value="+"] {
        background: #eef2ff;
        color: #4f46e5;
        font-weight: 600;
      }

      form div input[value="/"]:hover,
      form div input[value="*"]:hover,
      form div input[value="-"]:hover,
      form div input[value="+"]:hover {
        background: #e0e7ff;
      }

      form div input[value="AC"],
      form div input[value="DE"] {
        background: #fef2f2;
        color: #dc2626;
      }

      form div input[value="AC"]:hover,
      form div input[value="DE"]:hover {
        background: #fee2e2;
      }

      form div input[value="="] {
        background: #4f46e5;
        color: white;
        border-color: #4f46e5;
        font-weight: 600;
      }

      form div input[value="="]:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form>
        <input type="text" name="display" readonly />
        <div>
          <input type="button" value="AC" onclick="display.value = ''" />
          <input
            type="button"
            value="DE"
            onclick="display.value = display.value.slice(0, -1)"
          />
          <input type="button" value="." onclick="display.value += '.'" />
          <input type="button" value="/" onclick="display.value += '/'" />
        </div>

        <div>
          <input type="button" value="7" onclick="display.value += '7'" />
          <input type="button" value="8" onclick="display.value += '8'" />
          <input type="button" value="9" onclick="display.value += '9'" />
          <input type="button" value="*" onclick="display.value += '*'" />
        </div>

        <div>
          <input type="button" value="4" onclick="display.value += '4'" />
          <input type="button" value="5" onclick="display.value += '5'" />
          <input type="button" value="6" onclick="display.value += '6'" />
          <input type="button" value="-" onclick="display.value += '-'" />
        </div>

        <div>
          <input type="button" value="1" onclick="display.value += '1'" />
          <input type="button" value="2" onclick="display.value += '2'" />
          <input type="button" value="3" onclick="display.value += '3'" />
          <input type="button" value="+" onclick="display.value += '+'" />
        </div>

        <div>
          <input type="button" value="00" onclick="display.value += '00'" />
          <input type="button" value="0" onclick="display.value += '0'" />
          <input
            type="button"
            value="="
            onclick="display.value = eval(display.value)"
          />
        </div>
      </form>
    </div>
  </body>
</html>
