<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag and Drop </title>
  <style>
    *{
  margin: 0;
  padding: 0;;
  box-sizing: border-box;
}

.container{
  height : 100vh ;
  width: 100vw;
  background-color: black;
  display: flex;
  align-items: center;
  justify-content: center;
}

#left , #right {
  width : 300px ;
  min-height: 400px;
  border: 2px dashed white;
  margin: 20px;
}

.list{
  height: 60px ;
  background-color: blueviolet;
  margin: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab ; 
}
  </style>
  
</head>
<body>
  <div class="container">
    <div id="left">
      <div class="list" draggable="true">this is a list 01</div>
        <div class="list" draggable="true">this is a list 02</div>
          <div class="list" draggable="true">this is a list 03</div>
            <div class="list" draggable="true">this is a list 04</div>
    </div> 
    <div id="right"></div>
  </div>
</body>
<script>
 const lists = document.querySelectorAll(".list");
const leftBox = document.querySelector("#left");
const rightBox = document.querySelector("#right");
  
let selected = null;


for (let list of lists) {
  list.addEventListener("dragstart", function (e) {
    selected = e.target;
  });
}

rightBox.addEventListener("dragover", function (e) {
  e.preventDefault(); 
});

rightBox.addEventListener("drop", function (e) {
  if (selected) {
    rightBox.appendChild(selected);
    selected = null;
  }
});

leftBox.addEventListener("dragover", function (e) {
  e.preventDefault(); 
});

leftBox.addEventListener("drop", function (e) {
  if (selected) {
    leftBox.appendChild(selected);
    selected = null;
  }
});

</script>
</html>
