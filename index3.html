<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
   .square {
  height: 100px;
  width: 100px;
  margin: 10px;
}

.circle {
  height: 100px;
  width: 100px;
  margin: 10px;
  border-radius: 50%;
}

.boxContainer {
  min-height: 100vh;
  width: 90vw;
  background-color: #4c5a7b;
  border: 2px solid black;
  margin-top: 10px;
  padding: 10px;
  display: flex;
}

/* Inputs and Selects */
input,
select,
button {
  height: 35px;
  margin: 5px;
}

/* Text input */
input[type="text"] {
  width: 150px;
  padding: 5px;
}

/* Color input */
input[type="color"] {
  width: 50px;
}

/* Select */
select {
  width: 100px;
}

/* Buttons */
button {
  width: 70px;
  border: none;
  border-radius: 5px;
  background-color: rgb(73, 73, 169);
  color: white;
  cursor: pointer;
}

button:hover {
  background-color: darkblue;
}

#reset {
  background-color: rgb(240, 9, 9);
}

#reset:hover {
  background-color: darkred;
}
    </style>
  </head>
  <body>
    <input type="text" placeholder="write number"/>

    <input id="color" type="color" />
    <select name="" id="shape">
      <option value="square">Square</option>
      <option value="circle">Circle</option>
    </select>
    <button>Add</button>
    <button id="reset">Reset</button>
    <select name="" id="direction">
      <option value="row">Row</option>
      <option value="column">Column</option>
    </select>
    <div class="boxContainer">
      <!-- <div class="square"></div>
      <div class="circle"></div> -->
    </div>
  </body>
  <script>
    const inputTag = document.querySelector("input");
    const buttonTag = document.querySelector("button");
    const container = document.querySelector(".boxContainer");
    const colorInputTag = document.querySelector("#color");
    const shapeInput = document.getElementById("shape");
    const resetButton = document.getElementById("reset");
    const directionInput = document.getElementById("direction");

    directionInput.addEventListener("change", function () {
      const boxDirection = directionInput.value;
      console.log(container.style, boxDirection);
      container.style.flexDirection = boxDirection;
    });
    resetButton.addEventListener("click", function () {
      container.innerHTML = "";
    });

    // console.log(colorInputTag)
    //  console.dir(inputTag);
    // console.dir(buttonTag);
    // console.dir(container);

    buttonTag.addEventListener("click", function () {
      container.innerHTML = "";
      // console.dir(colorInputTag)
      // console.log(inputTag)
      const numberOfBoxes = inputTag.value;
      const boxColor = colorInputTag.value;
      const shape = shapeInput.value;
      // console.log(shape);
      // console.log(numberOfBoxes);
      for (let i = 1; i <= numberOfBoxes; i++) {
        const boxEle = document.createElement("div");
        boxEle.classList.add(shape);
        boxEle.style.backgroundColor = boxColor;
        boxEle.addEventListener("click", function () {
          boxEle.style.backgroundColor = "purple";
        });
        boxEle.addEventListener("dblclick", function () {
          container.removeChild(boxEle);
        });
        container.appendChild(boxEle);
        // console.log(boxEle);
      }
    });
  </script>
</html>
